<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Live Editor | Skhy AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://res.cloudinary.com/dp19oy6st/raw/upload/v1774612380/skhy-assets/cdn.jsdelivr.net_npm_mermaid_10_dist_mermaid.min_ysf1vb.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        .mermaid-preview svg { max-width: 100%; height: auto; }
        .glass-panel {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-200 font-sans antialiased overflow-hidden">
    <div class="flex flex-col h-screen">
        <!-- Navigation Bar -->
        <nav class="bg-[#111827]/80 backdrop-blur-md border-b border-white/5 px-6 py-3 flex items-center justify-between z-50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <span class="text-sm font-bold tracking-tight text-white uppercase italic">Skhy AI</span>
                    <span class="block text-[10px] text-emerald-400 font-medium tracking-widest leading-none mt-0.5 uppercase">Wiring Blueprint</span>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <a href="/plan-scenario" class="text-xs font-semibold text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Planner
                </a>
                <div class="h-4 w-px bg-white/10"></div>
                <button id="toggle-editor-btn" class="text-xs font-semibold text-emerald-400 hover:text-emerald-300 transition-colors">
                    Edit Diagram
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-grow flex flex-col lg:flex-row gap-0 overflow-hidden relative">

            <!-- Controls & Editor Panel (Hidden by default based on URL) -->
            <aside id="editor-panel" class="hidden absolute left-4 top-4 bottom-4 w-96 glass-panel rounded-2xl shadow-2xl z-40 p-6 flex flex-col gap-6 transform transition-all duration-300">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-white tracking-tight italic">Diagram Editor</h2>
                    <button id="close-editor-btn" class="p-1 hover:bg-white/10 rounded-lg text-gray-500 hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Mermaid Syntax</label>
                        <textarea id="mermaid-code" class="w-full h-48 bg-[#0b0f19] border border-white/5 rounded-xl p-4 font-mono text-xs text-gray-300 focus:ring-1 focus:ring-emerald-500/50 outline-none" spellcheck="false"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Layout</label>
                            <select id="layout-select" class="w-full bg-[#0b0f19] border border-white/5 rounded-lg py-2 px-3 text-xs text-white outline-none">
                                <option value="TD">Top Down</option>
                                <option value="LR">Left to Right</option>
                                <option value="BT">Bottom Up</option>
                                <option value="RL">Right to Left</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Theme</label>
                            <select id="theme-select" class="w-full bg-[#0b0f19] border border-white/5 rounded-lg py-2 px-3 text-xs text-white outline-none">
                                <option value="dark">Dark</option>
                                <option value="default">Default</option>
                                <option value="neutral">Neutral</option>
                                <option value="forest">Forest</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mt-auto space-y-2">
                    <button id="download-png-btn" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-white rounded-xl font-bold text-xs transition-all shadow-lg shadow-emerald-500/20">
                        Export as PNG
                    </button>
                    <p class="text-[9px] text-gray-500 text-center uppercase tracking-widest">Rendered with Mermaid.js</p>
                </div>
            </aside>

            <!-- Viewer Area -->
            <section class="flex-grow bg-[#0b0f19] relative flex flex-col">
                <div id="mermaid-preview-container" class="flex-grow flex items-center justify-center p-8 overflow-auto cursor-grab active:cursor-grabbing">
                    <div id="mermaid-preview" class="transition-transform duration-200 origin-center"></div>
                    <div id="error-container" class="hidden glass-panel p-6 rounded-2xl border-red-500/20 text-red-500 font-mono text-xs max-w-md"></div>
                </div>

                <!-- Floating Zoom Controls -->
                <div class="absolute bottom-6 right-6 flex items-center gap-2 glass-panel p-2 rounded-xl border-white/5">
                    <button id="zoom-out-btn" class="p-2 hover:bg-white/10 rounded-lg text-gray-400 hover:text-white transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                    </button>
                    <span id="zoom-label" class="text-[10px] font-bold text-white w-10 text-center tracking-tighter">100%</span>
                    <button id="zoom-in-btn" class="p-2 hover:bg-white/10 rounded-lg text-gray-400 hover:text-white transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                    <div class="w-px h-4 bg-white/10 mx-1"></div>
                    <button id="reset-zoom-btn" class="p-2 hover:bg-white/10 rounded-lg text-gray-400 hover:text-white transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const codeInput = document.getElementById('mermaid-code');
            const preview = document.getElementById('mermaid-preview');
            const errorContainer = document.getElementById('error-container');
            const editorPanel = document.getElementById('editor-panel');
            const toggleEditorBtn = document.getElementById('toggle-editor-btn');
            const closeEditorBtn = document.getElementById('close-editor-btn');
            const layoutSelect = document.getElementById('layout-select');
            const themeSelect = document.getElementById('theme-select');
            const zoomInBtn = document.getElementById('zoom-in-btn');
            const zoomOutBtn = document.getElementById('zoom-out-btn');
            const resetZoomBtn = document.getElementById('reset-zoom-btn');
            const zoomLabel = document.getElementById('zoom-label');
            const downloadPngBtn = document.getElementById('download-png-btn');

            let zoomLevel = 1;

            mermaid.initialize({ 
                startOnLoad: false, 
                theme: 'dark',
                securityLevel: 'loose',
                flowchart: { useMaxWidth: false, htmlLabels: true }
            });
            
            const loadFromUrl = async () => {
                const params = new URLSearchParams(window.location.search);
                const codeParam = params.get('code');
                const fileParam = params.get('file');

                if (codeParam) {
                    try {
                        const decodedCode = atob(codeParam.replace(/-/g, '+').replace(/_/g, '/'));
                        updateAndRender(decodedCode);
                    } catch (e) {
                        try {
                            updateAndRender(decodeURIComponent(codeParam));
                        } catch (e2) {
                            console.error('Failed to decode code param', e2);
                        }
                    }
                } else if (fileParam) {
                    try {
                        const response = await fetch(fileParam);
                        if (response.ok) {
                            const text = await response.text();
                            updateAndRender(text);
                        } else {
                            errorContainer.innerHTML = `<span class="text-white font-bold block mb-1">FETCH ERROR</span>Could not load file: ${fileParam}`;
                            errorContainer.classList.remove('hidden');
                        }
                    } catch (e) {
                        console.error('Failed to fetch file param', e);
                    }
                }
            };

            const updateAndRender = (newCode) => {
                if(newCode !== undefined) codeInput.value = newCode;
                renderMermaid();
            };

            const renderMermaid = async () => {
                const code = codeInput.value;
                if (!code) return;
                try {
                    await mermaid.parse(code);
                    const { svg } = await mermaid.render('graphDiv-' + Date.now(), code);
                    preview.innerHTML = svg;
                    preview.classList.remove('hidden');
                    errorContainer.classList.add('hidden');
                } catch (e) {
                    preview.classList.add('hidden');
                    errorContainer.textContent = e.message;
                    errorContainer.classList.remove('hidden');
                }
            };

            const toggleEditor = () => editorPanel.classList.toggle('hidden');
            const updateZoom = () => {
                preview.style.transform = `scale(${zoomLevel})`;
                zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
            };

            toggleEditorBtn.addEventListener('click', toggleEditor);
            closeEditorBtn.addEventListener('click', toggleEditor);
            codeInput.addEventListener('input', renderMermaid);
            zoomInBtn.addEventListener('click', () => { zoomLevel += 0.1; updateZoom(); });
            zoomOutBtn.addEventListener('click', () => { zoomLevel = Math.max(0.1, zoomLevel - 0.1); updateZoom(); });
            resetZoomBtn.addEventListener('click', () => { zoomLevel = 1; updateZoom(); });

            downloadPngBtn.addEventListener('click', () => {
                const svg = preview.querySelector('svg');
                if (!svg) return;
                const svgData = new XMLSerializer().serializeToString(svg);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                const svgSize = svg.getBoundingClientRect();
                canvas.width = svgSize.width * 2;
                canvas.height = svgSize.height * 2;
                img.onload = () => {
                    ctx.fillStyle = '#0b0f19';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const a = document.createElement('a');
                    a.download = 'wiring-diagram.png';
                    a.href = canvas.toDataURL('image/png');
                    a.click();
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            });

            loadFromUrl().then(() => {
                if (!codeInput.value) renderMermaid();
            });
        });
    </script>
</body>
</html>
